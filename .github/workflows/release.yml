name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          export CGO_ENABLED=0
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/aggregator-linux-amd64 ./cmd/aggregator
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/probe-linux-amd64     ./cmd/probe
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/probe-linux-arm64     ./cmd/probe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aggregator-linux-amd64
            dist/probe-linux-amd64
            dist/probe-linux-arm64
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push probe image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bangumi-status-probe:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/bangumi-status-probe:latest
